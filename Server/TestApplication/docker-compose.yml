services:
  webapi:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: testApplication
    ports:
      - "5000:80" # Exposes application on port 5000
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=database;Database=testdb;Username=postgres;Password=123456"
    depends_on:
      - database

  database:
    image: postgres:15
    container_name: test_db
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports: 
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: